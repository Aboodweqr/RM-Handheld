dependencies:
  espressif/esp_lvgl_port:
    component_hash: d3c020b45c3dfc0d1706a83b63a1c34a6eb444a6e935f9afff79f92b7b94dcef
    dependencies:
    - name: idf
      require: private
      version: '>=5.2'
    - name: lvgl/lvgl
      registry_url: https://components.espressif.com
      require: public
      version: '>=8,<10'
    source:
      registry_url: https://components.espressif.com/
      type: service
    version: 2.9.0
  espressif/usb_host_hid:
    component_hash: 74b9c84cd2921a5e987f504c1713ca7819f7e8be80565e5253e9e9c7e07ab881
    dependencies:
    - name: idf
      require: private
      version: '>=5.0'
    - name: espressif/usb
      registry_url: https://components.espressif.com
      require: public
      rules:
      - if: idf_version >=6.0
      - if: target not in ["linux"]
      version: ^1.0.0
    source:
      registry_url: https://components.espressif.com/
      type: service
    targets:
    - esp32s2
    - esp32s3
    - esp32p4
    - esp32h4
    - esp32s31
    - linux
    version: 1.2.1
  idf:
    source:
      type: idf
    version: 5.5.5
  lvgl/lvgl:
    component_hash: 7d82410747bbfb319531449749e940f440f8414f041f9eaba13f0d1dd7f58cdd
    dependencies:
    - name: espressif/freetype
      registry_url: https://components.espressif.com
      require: private
      rules:
      - if: idf_version >=5.5 && $CONFIG{LV_USE_FREETYPE} == True
      version: ^2.14.3
    - name: espressif/libjpeg-turbo
      registry_url: https://components.espressif.com
      require: private
      rules:
      - if: idf_version >=5.5 && $CONFIG{LV_USE_LIBJPEG_TURBO} == True
      version: ^3.1.1
    - name: espressif/libpng
      registry_url: https://components.espressif.com
      require: private
      rules:
      - if: idf_version >=5.5 && $CONFIG{LV_USE_LIBPNG} == True
      version: ^1.6.58
    - name: espressif/lz4
      registry_url: https://components.espressif.com
      require: private
      rules:
      - if: idf_version >=5.5 && $CONFIG{LV_USE_LZ4} == True && $CONFIG{LV_USE_LZ4_INTERNAL} == False
      version: ^1.10.0
    source:
      registry_url: https://components.espressif.com/
      type: service
    version: 9.6.0~1
direct_dependencies:
- espressif/esp_lvgl_port
- espressif/usb_host_hid
- idf
- lvgl/lvgl
