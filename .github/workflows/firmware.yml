name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - "protocol/**"
      - "tools/windows-flasher/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "protocol/**"
      - "tools/windows-flasher/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-flasher-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/windows-flasher/flash.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ESP32-S3 firmware and merged image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: >-
            idf.py -D PROJECT_VER=v0.1.9-crisp-controller build &&
            cd build &&
            esptool.py --chip esp32s3 merge_bin -o rm_handheld_merged.bin @flash_args

      - name: Verify crash-fix configuration
        shell: bash
        run: |
          grep -E '^(# )?CONFIG_(BT_ENABLED|BT_NIMBLE_ENABLED|ESP_COEX_SW_COEXIST_ENABLE|SW_COEXIST_ENABLE|LOG_DYNAMIC_LEVEL_CONTROL|LOG_TAG_LEVEL_IMPL_)' firmware/sdkconfig || true
          grep -q '^# CONFIG_LOG_DYNAMIC_LEVEL_CONTROL is not set' firmware/sdkconfig
          grep -q '^CONFIG_LOG_TAG_LEVEL_IMPL_NONE=y' firmware/sdkconfig
          grep -q '^CONFIG_ESP_MAIN_TASK_STACK_SIZE=12288' firmware/sdkconfig
          grep -q '\.swap_xy = true' firmware/main/dashboard_ui.cpp
          grep -q 'index < 8' firmware/main/dashboard_ui.cpp
          grep -q '\.swap_bytes = true' firmware/main/dashboard_ui.cpp

      - name: Package fixed Windows flasher
        shell: bash
        run: |
          set -euo pipefail
          package="dist/RM-Handheld-v0.1.9-windows-flasher"
          mkdir -p "$package/prebuilt"
          cp tools/windows-flasher/flash.bat "$package/"
          cp tools/windows-flasher/flash.ps1 "$package/"
          cp tools/windows-flasher/README.txt "$package/"
          cp firmware/build/rm_handheld_merged.bin "$package/prebuilt/rm_handheld_v0.1.9_merged.bin"
          (cd dist && zip -q -r RM-Handheld-v0.1.9-windows-flasher.zip RM-Handheld-v0.1.9-windows-flasher)
          sha256sum dist/RM-Handheld-v0.1.9-windows-flasher.zip > dist/RM-Handheld-v0.1.9-windows-flasher.zip.sha256

      - name: Package Spacehuhn web-flash image
        shell: bash
        run: |
          cp firmware/build/rm_handheld_merged.bin dist/RM-Handheld-v0.1.9-web-flash.bin
          sha256sum dist/RM-Handheld-v0.1.9-web-flash.bin > dist/RM-Handheld-v0.1.9-web-flash.bin.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rm-handheld-firmware-binaries
          path: |
            firmware/build/rm_handheld_merged.bin
            firmware/build/rm_handheld.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
            firmware/build/rm_handheld.elf
            firmware/build/rm_handheld.map
            firmware/sdkconfig
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: rm-handheld-v0.1.9-windows-flasher
          path: |
            dist/RM-Handheld-v0.1.9-windows-flasher.zip
            dist/RM-Handheld-v0.1.9-windows-flasher.zip.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: rm-handheld-v0.1.9-web-flash
          path: |
            dist/RM-Handheld-v0.1.9-web-flash.bin
            dist/RM-Handheld-v0.1.9-web-flash.bin.sha256
          if-no-files-found: error
