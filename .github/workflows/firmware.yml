name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - "protocol/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "protocol/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ESP32-S3 firmware and merged image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o rm_handheld_merged.bin @flash_args

      - uses: actions/upload-artifact@v4
        with:
          name: rm-handheld-firmware-binaries
          path: |
            firmware/build/rm_handheld_merged.bin
            firmware/build/rm_handheld.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
          if-no-files-found: error
